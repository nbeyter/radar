name: Haftalık Piyasa Radarı

on:
  schedule:
    # Her Pazartesi 06:00 UTC = 09:00 İstanbul (Türkiye UTC+3, DST yok)
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate this week's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_radar.py

      - name: Commit and push
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html archive/
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          EDITION=$(grep -oP 'data-edition="\K[0-9]+' index.html | head -1)
          git commit -m "Haftalık güncelleme: Sayı ${EDITION}"
          git push
